<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudarshana Chakra</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Cinzel', serif;
    }

    #v_src {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }

    #fx_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 3;
      pointer-events: none;
    }

    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
    }

    #title {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cinzel Decorative', serif;
      font-size: 17px;
      letter-spacing: 0.35em;
      color: #f0c060;
      text-shadow: 0 0 18px rgba(240, 180, 60, 0.9), 0 0 40px rgba(200, 120, 0, 0.5);
      white-space: nowrap;
      text-transform: uppercase;
    }

    #status {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #d4a040;
      text-shadow: 0 0 12px rgba(220, 160, 50, 0.6);
      white-space: nowrap;
      transition: color 0.3s, text-shadow 0.3s;
    }

    #status.ready {
      color: #ffe090;
      text-shadow: 0 0 16px rgba(255, 220, 100, 0.8);
    }

    #status.launched {
      color: #ffcc00;
      text-shadow: 0 0 16px rgba(255, 200, 0, 0.7);
    }

    #cam-error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff4444;
      font-size: 14px;
      text-align: center;
      display: none;
      z-index: 20;
      letter-spacing: 0.08em;
    }

    #watermark {
      position: absolute;
      bottom: 60px;
      right: 28px;
      font-size: 32px;
      color: rgba(200, 150, 30, 0.15);
      pointer-events: none;
      z-index: 5;
      user-select: none;
    }
  </style>
</head>

<body>

  <video id="v_src" autoplay playsinline muted></video>
  <canvas id="fx_canvas"></canvas>

  <div id="hud">
    <div id="title">✦ Sudarshana Chakra ✦</div>
    <div id="status">Show your hand to summon</div>
    <div id="watermark">ॐ</div>
  </div>

  <div id="cam-error">Camera access denied or unavailable.<br>Please allow camera permission and reload.</div>

  <script>
    const video = document.getElementById('v_src');
    const canvas = document.getElementById('fx_canvas');
    const ctx = canvas.getContext('2d');

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    const R = 170;
    const SPIKE_N = 32;
    const TILT_DEG = 18;
    const ROT_SPEED = 7.5;
    const LAUNCH_ROT = 30.0;
    const LAUNCH_SPD = 70;
    const FLICK_THR = 22;
    const TRAIL_N = 12;
    const SIN_T = Math.sin(TILT_DEG * Math.PI / 180);
    const ZOOM_RATE = 0.025;
    const lightningSound = new Audio('lightning.mp3');
    lightningSound.volume = 0.6;

    const RINGS = [
      { r: 1.00, w: 10 },
      { r: 0.72, w: 8 },
      { r: 0.50, w: 6 },
      { r: 0.32, w: 5 },
      { r: 0.16, w: 4 },
    ];

    const SPOKE_CONFIGS = [
      { rIn: 0.16, rOut: 0.72, n: 16 },
      { rIn: 0.72, rOut: 1.00, n: 32 },
    ];

    const STEP = 360 / SPIKE_N;
    const SPIKE_OFFSETS = [];
    for (let i = 0; i < SPIKE_N; i++) {
      const tip = i * STEP;
      const side = tip + STEP * 0.5;
      SPIKE_OFFSETS.push([tip, side - 2.2, side + 2.2]);
    }

    const rand = (lo, hi) => lo + Math.random() * (hi - lo);
    const now = () => performance.now() / 1000;
    const toRad = d => d * Math.PI / 180;

    function isOnlyIndexFingerUp(lms) {
      // Index finger up
      const indexUp = lms[8].y < lms[6].y;

      // Other fingers folded
      const middleDown = lms[12].y > lms[10].y;
      const ringDown = lms[16].y > lms[14].y;
      const pinkyDown = lms[20].y > lms[18].y;

      return indexUp && middleDown && ringDown && pinkyDown;
    }

    function proj(rw, thetaDeg, cx, cy) {
      const t = toRad(thetaDeg);
      return [cx + rw * Math.cos(t), cy - rw * Math.sin(t) * SIN_T];
    }

    const glowCanvas = document.createElement('canvas');
    const glowCtx = glowCanvas.getContext('2d');
    function syncGlow() { glowCanvas.width = canvas.width; glowCanvas.height = canvas.height; }
    syncGlow();
    window.addEventListener('resize', syncGlow);

    function glowEllipse(cx, cy, rx, ry, color, lw, blur) {
      glowCtx.save();
      glowCtx.shadowBlur = blur; glowCtx.shadowColor = color;
      glowCtx.strokeStyle = color; glowCtx.lineWidth = lw;
      glowCtx.beginPath();
      glowCtx.ellipse(cx, cy, Math.max(1, rx), Math.max(1, ry), 0, 0, Math.PI * 2);
      glowCtx.stroke();
      glowCtx.restore();
    }

    function glowCircle(cx, cy, r, color, blur) {
      glowCtx.save();
      glowCtx.shadowBlur = blur; glowCtx.shadowColor = color;
      glowCtx.fillStyle = color;
      glowCtx.beginPath();
      glowCtx.arc(cx, cy, Math.max(1, r), 0, Math.PI * 2);
      glowCtx.fill();
      glowCtx.restore();
    }

    const GOLD_DARK = '#6b4a1a';
    const GOLD_MID = '#a07030';
    const GOLD_LIGHT = '#d4a040';
    const GOLD_BRIGHT = '#f0d080';
    const GOLD_SHINE = '#fff5cc';
    const STONE_DARK = '#3d2a0a';
    const STONE_MID = '#7a5520';

    function drawChakra(cx, cy, angleDeg, scale = 1.0, alpha = 1.0) {
      const r = R * scale;
      if (r < 4) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      const discRx = r;
      const discRy = Math.max(1, r * SIN_T);
      ctx.fillStyle = STONE_DARK;
      ctx.beginPath();
      ctx.ellipse(cx, cy, discRx, discRy, 0, 0, Math.PI * 2);
      ctx.fill();
      for (let ri = 0; ri < RINGS.length; ri++) {
        const ring = RINGS[ri];
        const rr = r * ring.r;
        const ry = Math.max(1, rr * SIN_T);
        const rw = ring.w * scale;
        if (ri > 0) {
          const prev = RINGS[ri - 1];
          const gapR = r * (prev.r - 0.04);
          const gapY = Math.max(1, gapR * SIN_T);
          ctx.strokeStyle = STONE_DARK;
          ctx.lineWidth = 4 * scale;
          ctx.beginPath();
          ctx.ellipse(cx, cy, gapR, gapY, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        const ringGrad = ctx.createLinearGradient(cx, cy - rr, cx, cy + rr);
        ringGrad.addColorStop(0, GOLD_BRIGHT);
        ringGrad.addColorStop(0.25, GOLD_LIGHT);
        ringGrad.addColorStop(0.5, GOLD_MID);
        ringGrad.addColorStop(0.75, STONE_MID);
        ringGrad.addColorStop(1, STONE_DARK);
        ctx.strokeStyle = ringGrad;
        ctx.lineWidth = rw;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rr, ry, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = `rgba(255, 245, 200, ${alpha * 0.35})`;
        ctx.lineWidth = Math.max(0.5, rw * 0.2);
        ctx.beginPath();
        ctx.ellipse(cx, cy, rr + rw * 0.1, Math.max(1, (rr + rw * 0.1) * SIN_T), 0, Math.PI * 1.1, Math.PI * 1.9);
        ctx.stroke();
        glowEllipse(cx, cy, rr, ry, `rgba(180,120,30,${alpha * 0.25})`, rw + 4, 14);
      }
      for (const sc of SPOKE_CONFIGS) {
        const rIn = r * sc.rIn;
        const rOut = r * sc.rOut;
        const step = 360 / sc.n;
        for (let i = 0; i < sc.n; i++) {
          const a = angleDeg + i * step;
          const [x1, y1] = proj(rIn, a, cx, cy);
          const [x2, y2] = proj(rOut, a, cx, cy);
          ctx.strokeStyle = GOLD_MID;
          ctx.lineWidth = 1.2 * scale;
          ctx.globalAlpha = alpha * 0.7;
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
          ctx.strokeStyle = GOLD_BRIGHT;
          ctx.lineWidth = 0.4 * scale;
          ctx.globalAlpha = alpha * 0.4;
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        }
      }
      ctx.globalAlpha = alpha;
      const rOut = r + 38 * scale;
      const rBase = r - 4 * scale;
      for (const [tipOff, blOff, brOff] of SPIKE_OFFSETS) {
        const [tx, ty] = proj(rOut, angleDeg + tipOff, cx, cy);
        const [blx, bly] = proj(rBase, angleDeg + blOff, cx, cy);
        const [brx, bry] = proj(rBase, angleDeg + brOff, cx, cy);
        const sg = ctx.createLinearGradient(tx, ty, (blx + brx) / 2, (bly + bry) / 2);
        sg.addColorStop(0, GOLD_SHINE);
        sg.addColorStop(0.2, GOLD_BRIGHT);
        sg.addColorStop(0.55, GOLD_LIGHT);
        sg.addColorStop(0.8, GOLD_MID);
        sg.addColorStop(1, STONE_DARK);
        ctx.beginPath();
        ctx.moveTo(tx, ty); ctx.lineTo(blx, bly); ctx.lineTo(brx, bry);
        ctx.closePath();
        ctx.fillStyle = sg; ctx.fill();
        ctx.strokeStyle = `rgba(30, 15, 0, ${alpha * 0.6})`;
        ctx.lineWidth = 0.5; ctx.stroke();
        glowCtx.save();
        glowCtx.globalAlpha = alpha * 0.18;
        glowCtx.fillStyle = '#d4a040';
        glowCtx.shadowBlur = 12; glowCtx.shadowColor = '#a07030';
        glowCtx.beginPath();
        glowCtx.moveTo(tx, ty); glowCtx.lineTo(blx, bly); glowCtx.lineTo(brx, bry);
        glowCtx.closePath(); glowCtx.fill();
        glowCtx.restore();
      }
      const holeR = r * 0.10;
      const holeRy = Math.max(1, holeR * SIN_T);
      ctx.fillStyle = '#0a0500';
      ctx.beginPath();
      ctx.ellipse(cx, cy, holeR, holeRy, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = GOLD_MID;
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.ellipse(cx, cy, holeR + 3 * scale, holeRy + 1 * scale, 0, 0, Math.PI * 2);
      ctx.stroke();
      const hubR = Math.max(2, 7 * scale);
      glowCircle(cx, cy, hubR + 8, `rgba(220,180,60,${alpha})`, 16);
      const hg = ctx.createRadialGradient(cx, cy - hubR * 0.3, 0, cx, cy, hubR);
      hg.addColorStop(0, GOLD_SHINE);
      hg.addColorStop(0.4, GOLD_BRIGHT);
      hg.addColorStop(1, GOLD_MID);
      ctx.fillStyle = hg;
      ctx.shadowBlur = 12; ctx.shadowColor = '#f0c060';
      ctx.beginPath(); ctx.arc(cx, cy, hubR, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    class Lightning {
      constructor(tx, ty) {
        this.tx = tx; this.ty = ty;
        this.born = now(); this.dur = 1.6;
        this.segs = this._gen();
      }
      _gen() {
        const segs = [];
        let x = this.tx, y = 0;
        while (y < this.ty) {
          const nx = x + rand(-38, 38);
          const ny = Math.min(y + rand(22, 58), this.ty);
          if (Math.random() < 0.35) segs.push([[x, y], [nx + rand(-48, 48), ny - rand(8, 40)], true]);
          segs.push([[x, y], [nx, ny], false]);
          x = nx; y = ny;
        }
        return segs;
      }
      alive() { return (now() - this.born) < this.dur; }
      draw() {
        const age = now() - this.born;
        const fade = Math.max(0, 1 - age / this.dur) * (0.6 + Math.random() * 0.4);
        ctx.save();
        for (const [[x1, y1], [x2, y2], branch] of this.segs) {
          ctx.strokeStyle = `rgba(0,255,255,${fade})`;
          ctx.lineWidth = branch ? 2.5 : 5.5;
          ctx.shadowBlur = branch ? 14 : 28;
          ctx.shadowColor = `rgba(0,200,255,${fade})`;
          ctx.globalAlpha = fade;
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        }
        ctx.restore();
        const frac = age / this.dur;
        if (frac < 0.30) glowCircle(this.tx, this.ty, (1 - frac / 0.30) * 38, `rgba(0,255,255,${fade})`, 28);
      }
    }

    class Spawn {
      constructor() { this.born = now(); this.dur = 0.35; }
      scale() {
        const p = Math.min(1, (now() - this.born) / this.dur);
        return Math.sin(p * Math.PI / 2);
      }
      done() { return (now() - this.born) >= this.dur; }
    }

    class Launched {
      constructor(x, y, vx, vy) {
        this.x = x; this.y = y;
        this.vx = vx; this.vy = vy;
        this.rot = 0; this.zoom = 1.0;
        this.trail = [];
      }
      update() {
        this.trail.push({ x: this.x, y: this.y, rot: this.rot, zoom: this.zoom });
        if (this.trail.length > TRAIL_N) this.trail.shift();
        this.x += this.vx;
        this.y += this.vy;
        this.rot += LAUNCH_ROT;
        this.zoom += ZOOM_RATE;
      }
      outOfFrame() {
        const effR = R * this.zoom + 80;
        const W = canvas.width, H = canvas.height;
        return this.x < -effR || this.x > W + effR || this.y < -effR || this.y > H + effR;
      }
      draw() {
        const n = this.trail.length;
        for (let i = 0; i < n; i++) {
          const { x, y, rot, zoom } = this.trail[i];
          const a = (i + 1) / (n + 1) * 0.25;
          drawChakra(x, y, rot, zoom, a);
        }
        drawChakra(this.x, this.y, this.rot, this.zoom, 1.0);
      }
    }

    const flickBuf = [];
    const FLICK_BUF_MAX = 5;

    const S = { IDLE: 0, SPAWNING: 1, READY: 2, LAUNCHED: 3 };
    let state = S.IDLE;
    let lit = null, spawn = null, launched = null;
    let chakraAngle = 0, tipPos = null;
    let summonStart = 0;

    const statusEl = document.getElementById('status');
    const STATUS_MSGS = {
      [S.IDLE]: ['Lift your finger to summon', ''],
      [S.SPAWNING]: ['Sudarshana Chakra materialising…', ''],
      [S.READY]: ['Sudarshana Chakra locked — FLICK to launch', 'ready'],
      [S.LAUNCHED]: ['Jai Sudarshana…', 'launched'],
    };

    function setStatus(st) {
      const [msg, cls] = STATUS_MSGS[st] || ['', ''];
      statusEl.textContent = msg;
      statusEl.className = cls;
    }

    function render() {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(0,2,8,0.50)';
      ctx.fillRect(0, 0, W, H);
      glowCtx.clearRect(0, 0, W, H);

      if (lit && lit.alive()) {
        lit.draw();
      }

      if (state === S.SPAWNING && spawn && tipPos) {
        chakraAngle += ROT_SPEED;
        const sc = spawn.scale();
        glowCircle(tipPos.x, tipPos.y, 16 * sc, `rgba(200,140,30,0.8)`, 20);
        drawChakra(tipPos.x, tipPos.y, chakraAngle, sc, sc);
        if (spawn.done()) { state = S.READY; setStatus(S.READY); }
      }

      if (state === S.READY && tipPos) {
        chakraAngle += ROT_SPEED;
        drawChakra(tipPos.x, tipPos.y, chakraAngle, 1.0, 1.0);
        const pr = R + 9 + 5 * Math.sin(now() * 8.5);
        glowEllipse(tipPos.x, tipPos.y, pr, pr * SIN_T, `rgba(200,140,30,0.6)`, 3, 12);
      }

      if (state === S.LAUNCHED && launched) {
        launched.update();
        launched.draw();
        if (launched.outOfFrame()) {
          launched = null;

          setTimeout(() => {
            state = S.IDLE;
            setStatus(S.IDLE);
          }, 500);
        }
      }

      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.75;
      ctx.drawImage(glowCanvas, 0, 0);
      ctx.restore();

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    const hands = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });
    hands.setOptions({
      maxNumHands: 1, modelComplexity: 0,
      minDetectionConfidence: 0.70, minTrackingConfidence: 0.65
    });
    hands.onResults(onResults);

    function onResults(results) {
      const handUp = !!(results.multiHandLandmarks && results.multiHandLandmarks.length > 0);
      tipPos = null;
      let lms = null;
      if (handUp) {
        lms = results.multiHandLandmarks[0];
        const t = lms[8];
        tipPos = { x: (1 - t.x) * canvas.width, y: t.y * canvas.height };
      }

      if (state === S.IDLE) {
        if (handUp && tipPos && isOnlyIndexFingerUp(lms)) {

          if (summonStart === 0) {
            summonStart = performance.now();
          }

          const heldLongEnough =
            performance.now() - summonStart > 700;

          if (heldLongEnough) {

            lit = new Lightning(tipPos.x, tipPos.y);

            lightningSound.currentTime = 0;
            lightningSound.play();

            spawn = new Spawn();
            chakraAngle = 0;

            state = S.SPAWNING;
            setStatus(S.SPAWNING);

            flickBuf.length = 0;

            summonStart = 0;
          }

        } else {
          summonStart = 0;
        }
      } else if (state === S.SPAWNING) {
        if (!handUp) { state = S.IDLE; spawn = null; setStatus(S.IDLE); }
      } else if (state === S.READY) {
        if (!handUp) {
          state = S.IDLE; flickBuf.length = 0; setStatus(S.IDLE);
        } else {
          flickBuf.push(tipPos);
          if (flickBuf.length > FLICK_BUF_MAX) flickBuf.shift();
          if (flickBuf.length >= 3) {
            const old = flickBuf[flickBuf.length - 3];
            const dx = tipPos.x - old.x;
            const dy = tipPos.y - old.y;
            const spd = Math.hypot(dx, dy) / 2;
            if (spd > FLICK_THR) {
              const mag = Math.hypot(dx, dy);
              launched = new Launched(tipPos.x, tipPos.y,
                dx / mag * LAUNCH_SPD,
                dy / mag * LAUNCH_SPD);
              state = S.LAUNCHED;
              setStatus(S.LAUNCHED);
              flickBuf.length = 0;
            }
          }
        }
      }
    }

    const cam = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 1280, height: 720
    });
    cam.start().catch(err => {
      console.error('Camera error:', err);
      document.getElementById('cam-error').style.display = 'block';
    });
  </script>
</body>

</html>
